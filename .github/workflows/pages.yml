name: GitHub Pagesへ公開

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v6

      - name: pnpmを設定
        uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
          run_install: false

      - name: Node.jsを設定
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: 依存関係をインストール
        run: pnpm install --frozen-lockfile

      - name: 本番用サイトを生成
        env:
          ANALYTICS_ENABLED: "true"
          GTM_CONTAINER_ID: ${{ vars.GTM_CONTAINER_ID }}
        run: pnpm run build

      - name: ローカルリンクを検査
        run: pnpm run check:links

      - name: Metaと構造化データを検査
        run: pnpm run check:meta

      - name: 全ページのGTM構成を検査
        env:
          GTM_CONTAINER_ID: ${{ vars.GTM_CONTAINER_ID }}
        run: pnpm run check:analytics

      - name: GitHub Pagesを設定
        uses: actions/configure-pages@v5

      - name: 生成サイトをアップロード
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: GitHub Pagesへデプロイ
        id: deployment
        uses: actions/deploy-pages@v4
