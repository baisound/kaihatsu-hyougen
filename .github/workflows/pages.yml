name: GitHub Pagesへ公開

on:
  push:
    branches:
      - main
    paths:
      - "public/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v6

      - name: GitHub Pagesを設定
        uses: actions/configure-pages@v5

      - name: publicフォルダをアップロード
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: GitHub Pagesへデプロイ
        id: deployment
        uses: actions/deploy-pages@v4
